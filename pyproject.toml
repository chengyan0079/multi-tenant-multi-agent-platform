[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform"
version = "0.1.0"
description = "多 Agent 编排系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marshmallow<4",
    "langchain==1.2.10",
    "langchain-core==1.2.16",
    "langchain-text-splitters==1.1.1",
    "langgraph==1.0.9",
    "langgraph-prebuilt==1.0.8",
    "langgraph-checkpoint-postgres==2.0.8",
    "langchain-openai==1.1.10",
    "transformers==5.19.0",
    "sentence-transformers==6.1.0",
    "sentencepiece==0.2.2",
    "torch==2.14.1",
    "FlagEmbedding>=1.4.2",
    "fastapi==0.146.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "sse-starlette==2.1.3",
    "slowapi==0.1.10",
    "uuid6==2025.0.1",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "redis==8.1.0",
    "aio-pika==10.2.1",
    "pymilvus[model]==3.0.2",
    "numpy==2.5.4",
    "python-docx==1.2.0",
    "pymupdf==1.28.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "requests==2.34.2",
    "langfuse==5.2.0",  # Langfuse 可观测（SDK 5.x 对应服务端 4.x，OTEL 采集；软降级）
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "python-dotenv==1.2.4",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "mcp==2.3.0",
    "fastmcp>=4.1,<5",
    "nacos-sdk-python==3.2.0",
    "duckduckgo-search==8.1.1",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
